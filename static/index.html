<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="local-token" content="__TOKEN__">
  <meta name="color-scheme" content="light">
  <title>Pagelet · 找书</title>
  <script src="/static/theme.js"></script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%233988f8'/%3E%3Cpath d='M16 17h13l3 4 3-4h13v31H35l-3 3-3-3H16z' fill='none' stroke='white' stroke-width='3'/%3E%3Cpath d='M32 22v27' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="stylesheet" href="/static/login/login.css">
  <script src="/static/book-cache.js" defer></script>
  <script src="/static/app.js" defer></script>
  <script type="module" src="/static/login/login.js"></script>
</head>
<body>
  <header class="header"><div class="header-inner">
    <a class="brand" href="/">Pagelet</a>
    <nav class="tabs" aria-label="主导航">
      <button class="tab active" id="nav-search" type="button" aria-current="page">搜索</button>
      <button class="tab" id="nav-downloads" type="button">下载记录 <span class="count" id="job-count" hidden>0</span></button>
    </nav>
    <div class="account-actions">
      <span id="account-status">未检查账号</span>
      <button class="icon-button" id="refresh-profile" type="button" title="刷新账号和额度" aria-label="刷新账号和额度">↻</button>
      <button class="button small" id="login-button" type="button" title="打开账号登录窗口">登录</button>
      <button class="button small" id="nav-settings" type="button">设置</button>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换到深色模式" aria-pressed="false" title="切换到深色模式">
        <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 13.4A8.6 8.6 0 0 1 10.6 3.5a8.6 8.6 0 1 0 9.9 9.9Z"/></svg>
        <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.7"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div></header>

  <main>
    <section id="search-view">
      <form id="search-form">
        <label class="sr-only" for="query">书名、作者或 ISBN</label>
        <div class="search-line"><input id="query" name="query" maxlength="300" autocomplete="off" placeholder="书名、作者或 ISBN" required autofocus><button class="button primary" id="search-button" type="submit">搜索</button></div>
        <div class="filters">
          <label for="format">格式</label>
          <select id="format"><option value="">全部格式</option><option value="epub">EPUB</option><option value="pdf">PDF</option><option value="mobi">MOBI</option><option value="azw3">AZW3</option><option value="txt">TXT</option><option value="djvu">DJVU</option><option value="fb2">FB2</option></select>
          <label for="language">语言</label>
          <select id="language"><option value="">全部语言</option><option value="chinese">中文</option><option value="english">英文</option><option value="japanese">日文</option><option value="korean">韩文</option><option value="french">法文</option><option value="german">德文</option><option value="russian">俄文</option><option value="spanish">西班牙文</option></select>
        </div>
      </form>
      <div class="notice" id="setup-notice"><span>首次使用：先设置访问域名，再登录账号。</span><button class="text-button" id="setup-button" type="button">去设置</button></div>
      <div class="error-box" id="search-error" role="alert" hidden></div>
      <section class="featured-section" id="featured-section" aria-label="图书">
        <div id="featured-books" class="shelf-grid"><p class="shelf-status" role="status">正在加载书架…</p></div>
      </section>
      <section class="results-section" id="results-section" aria-labelledby="results-heading" hidden>
        <div class="section-heading"><h1 id="results-heading">搜索结果</h1><div class="results-actions"><span id="results-summary"></span><button class="text-button" id="back-home" type="button">返回书架</button></div></div>
        <div class="empty-state" id="empty-state"><p id="empty-title">暂无搜索结果</p><p class="muted" id="empty-description" hidden></p></div>
        <div class="loading-state" id="loading-state" role="status" aria-live="polite" hidden><span class="spinner"></span><span id="loading-message">正在搜索中，请耐心等待…</span></div>
        <div id="book-results"></div>
        <div class="pagination" id="pagination" hidden><button class="button small" id="prev-page" type="button">上一页</button><span id="page-label"></span><button class="button small" id="next-page" type="button">下一页</button></div>
      </section>
    </section>
    <section id="downloads-view" hidden>
      <div class="downloads-toolbar"><h1>下载记录 <span class="count" id="download-total">0</span></h1><button class="button small" id="open-folder" type="button">打开文件夹</button></div>
      <div id="download-list"></div>
      <div class="empty-state" id="downloads-empty"><p>暂无下载记录</p><button class="text-button" id="back-search" type="button">去搜索</button></div>
    </section>
  </main>

  <dialog id="settings-dialog" aria-labelledby="settings-heading"><form id="settings-form">
    <div class="dialog-heading"><h2 id="settings-heading">设置</h2><button class="icon-button" id="close-settings" type="button" aria-label="关闭设置">×</button></div>
    <label class="field-label" for="domain">访问域名</label>
    <div class="field-action"><input id="domain" type="url" list="domain-options" placeholder="检测后选择可用地址"><button class="button small" id="probe-button" type="button">检测域名</button></div>
    <datalist id="domain-options"></datalist><div class="domain-results" id="domain-results"></div>
    <p class="field-help">留空时使用原软件设置。</p>
    <label class="field-label" for="proxy">代理 <span>可选</span></label><input id="proxy" placeholder="http://127.0.0.1:7890" autocomplete="off">
    <p class="field-help">填写实际代理地址；检测域名前会先保存设置。</p>
    <label class="field-label" for="download-dir">下载文件夹</label><input id="download-dir" required>
    <p class="field-help">填写完整路径，文件夹不存在时自动创建。</p>
    <div class="error-box" id="settings-error" role="alert" hidden></div>
    <div class="dialog-footer"><button class="text-button danger" id="shutdown-button" type="button">退出服务</button><button class="button primary" id="save-settings" type="submit">保存</button></div>
  </form></dialog>
  <div id="login-ui"></div>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
