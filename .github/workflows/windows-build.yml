name: Windows portable build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: login-ui/package-lock.json
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pip install -r requirements-windows.txt --target vendor
      - run: python -m unittest discover -v
      - run: node --test test_book_cache.cjs
      - run: python scripts/build_windows.py
      - name: Check bundled native components
        run: python scripts/check_runtime.py dist/Pagelet/Pagelet.exe build/runtime-check.json
      - uses: actions/upload-artifact@v4
        with:
          name: Pagelet-windows-x64
          path: |
            dist/Pagelet-v*-windows-x64.zip
            dist/SHA256SUMS.txt
